# Builds Mimamori.exe on GitHub's Windows machines and attaches it to a release.
#
# To publish a release, either:
#   - Actions tab -> "Build and release" -> Run workflow -> type a version (e.g. v0.2.1), or
#   - git tag v0.2.1 && git push origin v0.2.1
# Running it by hand with the version box empty just makes a test build.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.1 (leave empty for a test build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the code
        if: github.ref_type == 'tag' || inputs.version != ''
        shell: pwsh
        run: |
          $want = "${{ inputs.version || github.ref_name }}".TrimStart('v')
          $code = (Select-String -Path mimamori/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($want -ne $code) {
            Write-Error "Releasing v$want, but mimamori/__init__.py says $code. Bump __version__ first."
            exit 1
          }
          Write-Output "Version $code OK"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name Mimamori
          --icon assets\mimamori.ico
          --add-data "assets;assets"
          --collect-all fugashi
          --collect-all unidic_lite
          --hidden-import unidic_lite
          main.py

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $name = if ($version) { $version } elseif ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $zip = "Mimamori-$name-windows.zip"
          Compress-Archive -Path dist\Mimamori -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Keep the build (test runs)
        if: github.ref_type != 'tag' && inputs.version == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.zip }}
          path: ${{ steps.zip.outputs.zip }}

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Mimamori ${{ inputs.version || github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: ${{ steps.zip.outputs.zip }}
          generate_release_notes: true
