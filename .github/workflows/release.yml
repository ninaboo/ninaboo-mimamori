# Builds Mimamori.exe on GitHub's Windows machines and attaches it to a release.
#
# To publish a release:  git tag v0.2.0  &&  git push origin v0.2.0
# (or run it by hand from the Actions tab to just get a test build).
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name Mimamori
          --icon assets\mimamori.ico
          --add-data "assets;assets"
          --collect-all fugashi
          --collect-all unidic_lite
          --hidden-import unidic_lite
          main.py

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $zip = "Mimamori-$name-windows.zip"
          Compress-Archive -Path dist\Mimamori -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Keep the build (test runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.zip }}
          path: ${{ steps.zip.outputs.zip }}

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.zip }}
          generate_release_notes: true
